<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="安徽大学纽约石溪学院应用物理课程资料索引，支持按课程名称搜索并跳转下载。">
  <meta name="theme-color" content="#f7f5ef">
  <title>SBIAHU Physics · 课程资料索引</title>
  <style>
    :root {
      --paper: #f7f5ef;
      --card: rgba(255, 255, 255, .78);
      --ink: #17201c;
      --muted: #68736d;
      --line: rgba(23, 32, 28, .11);
      --accent: #176b52;
      --accent-soft: #dcece5;
      --shadow: 0 18px 45px rgba(28, 50, 40, .08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 3%, rgba(233, 191, 103, .18), transparent 26rem),
        radial-gradient(circle at 95% 12%, rgba(59, 137, 109, .14), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(23, 107, 82, .23);
      font-family: Georgia, serif;
      font-size: 18px;
    }

    .repo-link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .45);
    }

    .repo-link:hover { color: var(--accent); border-color: rgba(23, 107, 82, .35); }

    .hero {
      padding: 72px 0 48px;
      max-width: 820px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 650;
    }

    .intro {
      max-width: 680px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.85;
    }

    .stats {
      display: flex;
      gap: 32px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .stats strong {
      color: var(--ink);
      font-size: 22px;
      margin-right: 5px;
    }

    .finder {
      position: sticky;
      top: 12px;
      z-index: 10;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(247, 245, 239, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 54px;
      padding: 0 48px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      font: inherit;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }

    #search:focus {
      border-color: rgba(23, 107, 82, .65);
      box-shadow: 0 0 0 4px rgba(23, 107, 82, .1);
    }

    .clear {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      font-size: 19px;
      cursor: pointer;
      display: none;
    }

    .clear:hover { background: var(--accent-soft); color: var(--accent); }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      flex: none;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .6);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .filter:hover, .filter.active {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .results-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 46px 2px 18px;
    }

    .results-head h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    #count { color: var(--muted); font-size: 13px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding-bottom: 70px;
    }

    .course {
      min-height: 154px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 5px 18px rgba(28, 50, 40, .035);
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .course:hover {
      transform: translateY(-3px);
      border-color: rgba(23, 107, 82, .3);
      box-shadow: 0 16px 32px rgba(28, 50, 40, .1);
    }

    .course:focus-visible { outline: 3px solid rgba(23, 107, 82, .25); outline-offset: 3px; }

    .semester {
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .course-name {
      margin: 16px 0 11px;
      font-size: 18px;
      font-weight: 720;
      line-height: 1.45;
      letter-spacing: -.015em;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    .arrow { color: var(--accent); font-size: 18px; transition: transform .2s; }
    .course:hover .arrow { transform: translateX(3px); }

    .empty {
      display: none;
      padding: 70px 24px;
      border: 1px dashed rgba(23, 32, 28, .2);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      grid-column: 1 / -1;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0 44px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer p { margin: 0; }
    footer a { color: var(--accent); text-underline-offset: 3px; }

    @media (max-width: 780px) {
      .hero { padding-top: 45px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .repo-link span { display: none; }
    }

    @media (max-width: 520px) {
      .shell { width: min(100% - 22px, 1080px); }
      header { padding: 18px 0; }
      .hero { padding: 40px 4px 36px; }
      .stats { gap: 18px; }
      .finder { top: 7px; border-radius: 18px; padding: 10px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .course { min-height: 138px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#top" aria-label="返回首页">
        <span class="brand-mark">P</span>
        <span>SBIAHU Physics</span>
      </a>
      <a class="repo-link" href="https://github.com/wenhuirdics-wq/Course-Materials-from-SBIAHU-Physics" target="_blank" rel="noopener">
        GitHub <span>仓库</span> ↗
      </a>
    </header>

    <main id="top">
      <section class="hero">
        <p class="eyebrow">Course Materials Index</p>
        <h1>课程资料，<br>一搜即达。</h1>
        <p class="intro">安大石溪学院应用物理课程资料个人整理。选择学期或搜索课程名称，点击卡片即可下载对应资料包。</p>
        <div class="stats" aria-label="资料统计">
          <span><strong id="course-total">24</strong>门课程</span>
          <span><strong>6</strong>个分类</span>
          <span>持续更新</span>
        </div>
      </section>

      <section class="finder" aria-label="课程搜索与筛选">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label for="search" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">搜索课程</label>
          <input id="search" type="search" placeholder="搜索课程，例如：近代物理、微积分……" autocomplete="off">
          <button class="clear" type="button" aria-label="清空搜索">×</button>
        </div>
        <div class="filters" role="group" aria-label="按学期筛选"></div>
      </section>

      <div class="results-head">
        <h2 id="results-title">全部资料</h2>
        <span id="count" aria-live="polite"></span>
      </div>

      <section id="course-grid" class="grid" aria-label="课程列表"></section>
    </main>

    <footer>
      <p>资料仅用于个人学习交流，请勿用于商业用途。<br>部分资料可能不完整，请以任课教师要求为准。</p>
      <p>维护者：Mr. Radics<br><a href="mailto:Radics_in_sbiahu@outlook.com">联系邮箱</a></p>
    </footer>
  </div>

  <script>
    const repository = 'https://github.com/wenhuirdics-wq/Course-Materials-from-SBIAHU-Physics';
    const groups = [
      { semester: '大一上', tag: 'freshman-fall-v1', courses: ['应用微积分I、II', '思政', '军事理论'] },
      { semester: '大一下', tag: 'freshman-spring-v1', courses: ['线性代数', '应用微积分III', '经典物理II', '经典物理实验II', '中国近现代史纲要'] },
      { semester: '大二上', tag: 'sophomore-fall-v1', courses: ['物理与天文学的计算方法', '大学艺术', '近代物理', '近代物理实验', '数理方程', '应用微积分IV', '习概', '毛概'] },
      { semester: '大二下', tag: 'sophomore-spring-v1', courses: ['电磁学理论I', '波和光学', '马原', '概率论'] },
      { semester: '英语与选修', tag: 'english-electives-v1', courses: ['WAE 192', 'WAE 194', '材料科学基础'] },
      { semester: '其他', tag: 'other-resources-v1', courses: ['高数额外资料'] }
    ];

    const courses = groups.flatMap(group => group.courses.map(name => ({
      name,
      semester: group.semester,
      tag: group.tag,
      url: `${repository}/releases/download/${group.tag}/${encodeURIComponent(name + '.zip')}`
    })));

    const filters = document.querySelector('.filters');
    const grid = document.querySelector('#course-grid');
    const input = document.querySelector('#search');
    const clear = document.querySelector('.clear');
    const count = document.querySelector('#count');
    const title = document.querySelector('#results-title');
    let activeSemester = '全部';

    ['全部', ...groups.map(group => group.semester)].forEach(semester => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `filter${semester === '全部' ? ' active' : ''}`;
      button.textContent = semester;
      button.setAttribute('aria-pressed', semester === '全部');
      button.addEventListener('click', () => {
        activeSemester = semester;
        document.querySelectorAll('.filter').forEach(item => {
          const selected = item.textContent === semester;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-pressed', selected);
        });
        render();
      });
      filters.appendChild(button);
    });

    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[character]);
    }

    function render() {
      const keyword = input.value.trim().toLocaleLowerCase('zh-CN');
      const visible = courses.filter(course => {
        const matchesSemester = activeSemester === '全部' || course.semester === activeSemester;
        const matchesKeyword = !keyword || `${course.name} ${course.semester}`.toLocaleLowerCase('zh-CN').includes(keyword);
        return matchesSemester && matchesKeyword;
      });

      title.textContent = keyword ? '搜索结果' : activeSemester === '全部' ? '全部资料' : activeSemester;
      count.textContent = `找到 ${visible.length} 门课程`;
      clear.style.display = input.value ? 'block' : 'none';

      grid.innerHTML = visible.map(course => `
        <a class="course" href="${course.url}" title="下载 ${escapeHtml(course.name)}" aria-label="下载 ${escapeHtml(course.name)} 资料包">
          <div>
            <span class="semester">${escapeHtml(course.semester)}</span>
            <div class="course-name">${escapeHtml(course.name)}</div>
          </div>
          <div class="download"><span>下载 ZIP 资料包</span><span class="arrow" aria-hidden="true">→</span></div>
        </a>
      `).join('') + (visible.length ? '' : '<div class="empty">没有找到相关课程，换个关键词试试。</div>');
    }

    input.addEventListener('input', render);
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        input.value = '';
        render();
      }
    });
    clear.addEventListener('click', () => {
      input.value = '';
      input.focus();
      render();
    });

    document.querySelector('#course-total').textContent = courses.length;
    render();
  </script>
</body>
</html>
