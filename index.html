<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="安徽大学纽约石溪学院应用物理课程资料索引，支持按课程名称搜索并跳转下载。">
  <meta name="theme-color" content="#f7f5ef">
  <title>SBIAHU Physics · 课程资料索引</title>
  <style>
    :root {
      --paper: #f7f5ef;
      --card: rgba(255, 255, 255, .78);
      --ink: #17201c;
      --muted: #68736d;
      --line: rgba(23, 32, 28, .11);
      --accent: #176b52;
      --accent-soft: #dcece5;
      --shadow: 0 18px 45px rgba(28, 50, 40, .08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 3%, rgba(233, 191, 103, .18), transparent 26rem),
        radial-gradient(circle at 95% 12%, rgba(59, 137, 109, .14), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(23, 107, 82, .23);
      font-family: Georgia, serif;
      font-size: 18px;
    }

    .repo-link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .45);
    }

    .repo-link:hover { color: var(--accent); border-color: rgba(23, 107, 82, .35); }

    .hero {
      padding: 72px 0 48px;
      max-width: 820px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(42px, 6vw, 70px);
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 650;
      white-space: nowrap;
    }

    .intro {
      max-width: none;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.85;
      white-space: nowrap;
    }

    .stats {
      display: flex;
      align-items: baseline;
      gap: 38px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .stats > span {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1;
      white-space: nowrap;
    }

    .stats strong {
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .finder {
      position: sticky;
      top: 12px;
      z-index: 10;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(247, 245, 239, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 54px;
      padding: 0 48px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      font: inherit;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }

    #search:focus {
      border-color: rgba(23, 107, 82, .65);
      box-shadow: 0 0 0 4px rgba(23, 107, 82, .1);
    }

    .clear {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      font-size: 19px;
      cursor: pointer;
      display: none;
    }

    .clear:hover { background: var(--accent-soft); color: var(--accent); }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      flex: none;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .6);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .filter:hover, .filter.active {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .results-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 46px 2px 18px;
    }

    .results-head h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    #count { color: var(--muted); font-size: 13px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding-bottom: 70px;
    }

    .course {
      min-height: 154px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 5px 18px rgba(28, 50, 40, .035);
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .course:hover {
      transform: translateY(-3px);
      border-color: rgba(23, 107, 82, .3);
      box-shadow: 0 16px 32px rgba(28, 50, 40, .1);
    }

    .course:focus-visible { outline: 3px solid rgba(23, 107, 82, .25); outline-offset: 3px; }

    .semester {
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .course-name {
      margin: 16px 0 11px;
      font-size: 18px;
      font-weight: 720;
      line-height: 1.45;
      letter-spacing: -.015em;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    .arrow { color: var(--accent); font-size: 18px; transition: transform .2s; }
    .course:hover .arrow { transform: translateX(3px); }

    .empty {
      display: block;
      padding: 70px 24px;
      border: 1px dashed rgba(23, 32, 28, .2);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      grid-column: 1 / -1;
    }

    .status-card {
      grid-column: 1 / -1;
      padding: 52px 24px;
      border: 1px dashed rgba(23, 32, 28, .2);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .status-card a { color: var(--accent); text-underline-offset: 3px; }

    footer {
      text-align: center;
      padding: 28px 0 44px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer p { margin: 0; }

    @media (max-width: 780px) {
      .hero { padding-top: 45px; }
      h1, .intro { white-space: normal; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .repo-link span { display: none; }
    }

    @media (max-width: 520px) {
      .shell { width: min(100% - 22px, 1080px); }
      header { padding: 18px 0; }
      .hero { padding: 40px 4px 36px; }
      .stats { gap: 18px; flex-wrap: wrap; }
      .finder { top: 7px; border-radius: 18px; padding: 10px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .course { min-height: 138px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#top" aria-label="返回首页">
        <span class="brand-mark">P</span>
        <span>SBIAHU Physics</span>
      </a>
      <a class="repo-link" href="https://github.com/wenhuirdics-wq/Course-Materials-from-SBIAHU-Physics" target="_blank" rel="noopener">
        GitHub <span>仓库</span> ↗
      </a>
    </header>

    <main id="top">
      <section class="hero">
        <p class="eyebrow">Course Materials Index</p>
        <h1>课程资料，一搜即达。</h1>
        <p class="intro">安大石溪学院应用物理课程资料个人整理。选择学期或搜索课程名称，点击卡片即可下载对应资料包。</p>
        <div class="stats" aria-label="资料统计">
          <span><strong id="course-total">—</strong>份资料</span>
          <span><strong id="release-total">—</strong>个分类</span>
          <span><strong>实时</strong>同步</span>
        </div>
      </section>

      <section class="finder" aria-label="课程搜索与筛选">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label for="search" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">搜索课程</label>
          <input id="search" type="search" placeholder="搜索课程，例如：近代物理、微积分……" autocomplete="off">
          <button class="clear" type="button" aria-label="清空搜索">×</button>
        </div>
        <div class="filters" role="group" aria-label="按学期筛选"></div>
      </section>

      <div class="results-head">
        <h2 id="results-title">全部资料</h2>
        <span id="count" aria-live="polite"></span>
      </div>

      <section id="course-grid" class="grid" aria-label="课程列表"></section>
    </main>

    <footer>
      <p class="notice">资料仅供个人学习交流，请勿商用<br>资料仅作分享，不保证指导作用，请以任课教师要求为准<br>如有需要，可予联络：AdrianY7615@163.com</p>
    </footer>
  </div>

  <script>
    const repository = 'https://github.com/wenhuirdics-wq/Course-Materials-from-SBIAHU-Physics';
    const releasesApi = 'https://api.github.com/repos/wenhuirdics-wq/Course-Materials-from-SBIAHU-Physics/releases?per_page=100';
    const preferredOrder = ['大一上', '大一下', '大二上', '大二下', '英语与选修', '其他'];
    const displayAliases = {
      'applied-calculus-1-2.zip': '应用微积分I、II',
      'classical-physics-1.zip': '经典物理I',
      'ideological-politics.zip': '思政',
      'military-theory.zip': '军事理论',
      'linear-algebra.zip': '线性代数',
      'applied-calculus-3.zip': '应用微积分III',
      'classical-physics-2.zip': '经典物理II',
      'classical-physics-lab-2.zip': '经典物理实验II',
      'modern-chinese-history.zip': '中国近现代史纲要',
      'computational-physics-astronomy.zip': '物理与天文学的计算方法',
      'university-art.zip': '大学艺术',
      'modern-physics.zip': '近代物理',
      'modern-physics-lab.zip': '近代物理实验',
      'mathematical-equations.zip': '数理方程',
      'applied-calculus-4.zip': '应用微积分IV',
      'xi-thought.zip': '习概',
      'maoism.zip': '毛概',
      'electromagnetism-1.zip': '电磁学理论I',
      'waves-optics.zip': '波和光学',
      'marxist-principles.zip': '马原',
      'probability.zip': '概率论',
      'complex-analysis.zip': '复变',
      'wae-192.zip': 'WAE 192',
      'wae-194.zip': 'WAE 194',
      'materials-science.zip': '材料科学基础',
      'advanced-math-extra.zip': '高数额外资料'
    };
    const preferredCourseOrder = [
      '应用微积分I、II', '经典物理I', '思政', '军事理论',
      '线性代数', '应用微积分III', '经典物理II', '经典物理实验II', '中国近现代史纲要',
      '物理与天文学的计算方法', '大学艺术', '近代物理', '近代物理实验', '数理方程', '应用微积分IV', '习概', '毛概',
      '电磁学理论I', '波和光学', '马原', '概率论', '复变',
      'WAE 192', 'WAE 194', '材料科学基础', '高数额外资料'
    ];
    let groups = [];
    let courses = [];

    const filters = document.querySelector('.filters');
    const grid = document.querySelector('#course-grid');
    const input = document.querySelector('#search');
    const clear = document.querySelector('.clear');
    const count = document.querySelector('#count');
    const title = document.querySelector('#results-title');
    let activeSemester = '全部';

    function buildFilters() {
      filters.innerHTML = '';
      ['全部', ...groups.map(group => group.semester)].forEach(semester => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `filter${semester === activeSemester ? ' active' : ''}`;
        button.textContent = semester;
        button.setAttribute('aria-pressed', semester === activeSemester);
        button.addEventListener('click', () => {
          activeSemester = semester;
          document.querySelectorAll('.filter').forEach(item => {
            const selected = item.textContent === semester;
            item.classList.toggle('active', selected);
            item.setAttribute('aria-pressed', selected);
          });
          render();
        });
        filters.appendChild(button);
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[character]);
    }

    function displayName(fileName) {
      return displayAliases[fileName.toLowerCase()] || fileName.replace(/\.(?:zip|rar|7z|tar\.gz)$/i, '');
    }

    function fileType(fileName) {
      const match = fileName.match(/\.([^.]+)$/);
      return match ? match[1].toUpperCase() : '文件';
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / Math.pow(1024, index);
      return `${value >= 10 || index === 0 ? value.toFixed(0) : value.toFixed(1)} ${units[index]}`;
    }

    function render() {
      const keyword = input.value.trim().toLocaleLowerCase('zh-CN');
      const visible = courses.filter(course => {
        const matchesSemester = activeSemester === '全部' || course.semester === activeSemester;
        const matchesKeyword = !keyword || `${course.name} ${course.semester}`.toLocaleLowerCase('zh-CN').includes(keyword);
        return matchesSemester && matchesKeyword;
      });

      title.textContent = keyword ? '搜索结果' : activeSemester === '全部' ? '全部资料' : activeSemester;
      count.textContent = `找到 ${visible.length} 门课程`;
      clear.style.display = input.value ? 'block' : 'none';

      grid.innerHTML = visible.map(course => `
        <a class="course" href="${escapeHtml(course.url)}" title="下载 ${escapeHtml(course.fileName)}" aria-label="下载 ${escapeHtml(course.fileName)}">
          <div>
            <span class="semester">${escapeHtml(course.semester)}</span>
            <div class="course-name">${escapeHtml(course.name)}</div>
          </div>
          <div class="download"><span>下载 ${escapeHtml(course.type)}${course.size ? ` · ${escapeHtml(course.size)}` : ''}</span><span class="arrow" aria-hidden="true">→</span></div>
        </a>
      `).join('') + (visible.length ? '' : '<div class="empty">没有找到相关课程，换个关键词试试。</div>');
    }

    async function loadReleases() {
      grid.innerHTML = '<div class="status-card">正在同步 GitHub Releases 中的真实资料……</div>';
      count.textContent = '正在同步';

      try {
        const response = await fetch(releasesApi, {
          headers: { Accept: 'application/vnd.github+json' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`GitHub API ${response.status}`);

        const releases = await response.json();
        groups = releases
          .filter(release => !release.draft && Array.isArray(release.assets) && release.assets.length)
          .map(release => ({
            semester: release.name || release.tag_name,
            tag: release.tag_name,
            releaseUrl: release.html_url,
            courses: release.assets
              .filter(asset => asset.state === 'uploaded')
              .map(asset => ({
                name: displayName(asset.name),
                fileName: asset.name,
                semester: release.name || release.tag_name,
                tag: release.tag_name,
                url: asset.browser_download_url,
                type: fileType(asset.name),
                size: formatBytes(asset.size)
              }))
              .sort((a, b) => {
                const aIndex = preferredCourseOrder.indexOf(a.name);
                const bIndex = preferredCourseOrder.indexOf(b.name);
                if (aIndex === -1 && bIndex === -1) return a.name.localeCompare(b.name, 'zh-CN');
                if (aIndex === -1) return 1;
                if (bIndex === -1) return -1;
                return aIndex - bIndex;
              })
          }))
          .filter(group => group.courses.length)
          .sort((a, b) => {
            const aIndex = preferredOrder.indexOf(a.semester);
            const bIndex = preferredOrder.indexOf(b.semester);
            if (aIndex === -1 && bIndex === -1) return 0;
            if (aIndex === -1) return 1;
            if (bIndex === -1) return -1;
            return aIndex - bIndex;
          });

        courses = groups.flatMap(group => group.courses);
        activeSemester = groups.some(group => group.semester === activeSemester) ? activeSemester : '全部';
        document.querySelector('#course-total').textContent = courses.length;
        document.querySelector('#release-total').textContent = groups.length;
        buildFilters();
        render();
      } catch (error) {
        console.error('同步 Releases 失败', error);
        count.textContent = '同步失败';
        grid.innerHTML = `<div class="status-card">暂时无法读取 GitHub Releases。<br><a href="${repository}/releases">前往 Releases 页面下载</a>，或稍后刷新重试。</div>`;
      }
    }

    input.addEventListener('input', render);
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        input.value = '';
        render();
      }
    });
    clear.addEventListener('click', () => {
      input.value = '';
      input.focus();
      render();
    });

    loadReleases();
  </script>
</body>
</html>
